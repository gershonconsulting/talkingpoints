name = "gershon-talkingpoints"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "talkingpoints-db"
database_id = "a1ac634b-d6f9-469d-b3d5-bc75c882abd4"

# Read-only links to the other Gershon platforms (same Cloudflare account), used by Admin → Add a client:
# client.gershon.ai companies (name, Streak pipeline, client report emails) and ICP.gershon.ai reports.
[[kv_namespaces]]
binding = "CRM_KV"
id = "99d8d5c662ca467cb60ab93e8e2b02f3"

[[kv_namespaces]]
binding = "ICP_KV"
id = "4bf369dab5d8439a959f5af7b7ed7d95"

[vars]
# Public OAuth client IDs (not secrets). The 3 secrets are set in Cloudflare → gershon-talkingpoints → Settings → Variables and Secrets.
LINKEDIN_CLIENT_ID = "78b871bbkd4wyu"
GOOGLE_CLIENT_ID = "905961246921-42hr3jfob0mkolb9798pic2cdqnag1ep.apps.googleusercontent.com"
APP_URL = "https://talkingpoints.gershon.ai"
EMAIL_ENABLED = "false"
EMAIL_ON_DRAFT = "false"
