<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in to Talking Points</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="stylesheet" href="/common.css" />
<style>
  body { background: linear-gradient(180deg, #fff5f5 0%, #fafafa 60%); min-height: 100vh; }
  .auth-wrap { max-width: 420px; margin: 80px auto; padding: 30px; background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  @media (max-width: 480px) { .auth-wrap { margin: 24px 16px; } }
  .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 800; font-size: 20px; color: var(--brand); }
  .auth-logo img { width: 32px; height: 32px; }
  .auth-wrap h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
  .auth-wrap .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 22px; }
  .auth-footer { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .auth-footer a { color: var(--brand); font-weight: 600; }
  .auth-error { padding: 10px 12px; background: var(--error-light); color: var(--error); border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .auth-error.show { display: block; }
  .li-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px; background: #0a66c2; color: #fff; border-radius: 8px; font-weight: 700; font-size: 15px; transition: background .15s; box-shadow: 0 2px 8px rgba(10,102,194,0.25); }
  .li-btn:hover { background: #004182; }
  .li-btn:focus-visible { outline: 3px solid rgba(10,102,194,0.4); outline-offset: 2px; }
</style>
<link rel="stylesheet" href="/unified-theme.css?v=1.1.0" />
</head>
<body>
  <div class="auth-wrap">
    <a class="auth-logo" href="/"><img src="/logo.svg" alt="" />Talking Points</a>
    <h1>Sign in</h1>
    <p class="subtitle">Use the LinkedIn account tied to your work email.</p>
    <div class="auth-error" id="err" role="alert"></div>
    <a class="li-btn" href="/api/auth/linkedin/start">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      Sign in with LinkedIn
    </a>
    <div class="auth-footer">No access yet? <a href="mailto:olivier@gershonconsulting.com?subject=Talking%20Points%20access">Ask Gershon Consulting</a></div>
  </div>
<script>
(function () {
  var messages = {
    cancelled: 'Sign-in was cancelled on LinkedIn. Try again when you are ready.',
    expired: 'The sign-in link expired. Start again.',
    linkedin: 'LinkedIn did not confirm your sign-in. Try again in a minute.',
    noemail: 'Your LinkedIn account has no email we can read. Add a verified email on LinkedIn, then try again.',
    notinvited: 'This LinkedIn email is not linked to a client account yet. Ask Gershon Consulting to add you.'
  };
  var e = new URLSearchParams(location.search).get('error');
  if (e) { var box = document.getElementById('err'); box.textContent = messages[e] || 'Sign-in failed. Try again.'; box.classList.add('show'); }
})();
</script>
</body>
</html>
