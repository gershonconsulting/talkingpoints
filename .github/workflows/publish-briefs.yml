name: Publish researched briefs
on:
  push:
    branches: [main]
    paths: ['research/**.json']
  workflow_dispatch:

# Posts every researched brief in research/<client>/*.json to /api/briefs (status "ready", never emailed).
# Same no-secret route as the hourly job: a GitHub OIDC token checked by the app.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post briefs
        run: |
          TOKEN=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=talkingpoints.gershon.ai" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          fail=0
          for f in research/*/*.json; do
            echo "== $f"
            curl -sf -X POST https://talkingpoints.gershon.ai/api/briefs -H "Authorization: Bearer $TOKEN" \
              -H 'content-type: application/json' --data-binary @"$f" || fail=1
            echo
          done
          exit $fail
