name: Deploy talkingpoints.gershon.ai
on:
  push:
    branches: [main]
  workflow_dispatch:

# One-time setup (Charles): add these repository secrets in GitHub → Settings → Secrets → Actions
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID       (same values as the linalysis repo)
#   LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET        (LinkedIn app "Talking Points" → Auth tab)
#   STREAK_API_KEY                                    (Streak → Integrations → API key)
#   RESEND_API_KEY                                    (Resend key for gershon.ai)
# Optional: PAPPERS_API_KEY, COMPANIES_HOUSE_API_KEY (financials for FR / UK leads)
# Internal secrets (session, webhook, ingest) are derived from CLOUDFLARE_API_TOKEN, so nobody types them.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: talkingpoints
      DOMAIN: talkingpoints.gershon.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4

      - name: Derive internal secrets
        run: |
          d() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" | awk '{print $2}'; }
          echo "::add-mask::$(d tp-session)"; echo "::add-mask::$(d tp-webhook)"; echo "::add-mask::$(d tp-ingest)"
          echo "SESSION_SECRET=$(d tp-session)" >> $GITHUB_ENV
          echo "WEBHOOK_TOKEN=$(d tp-webhook)" >> $GITHUB_ENV
          echo "INGEST_TOKEN=$(d tp-ingest)" >> $GITHUB_ENV

      - name: Database (create once, then apply schema + seed)
        run: |
          set -e
          ID=$(wrangler d1 list --json | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='talkingpoints-db'),''))")
          if [ -z "$ID" ]; then
            wrangler d1 create talkingpoints-db
            ID=$(wrangler d1 list --json | python3 -c "import json,sys;print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='talkingpoints-db'))")
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          wrangler d1 execute talkingpoints-db --remote --file=schema.sql -y
          wrangler d1 execute talkingpoints-db --remote --file=seed.sql -y

      - name: Pages project (create once)
        run: wrangler pages project create "$PROJECT" --production-branch=main || true

      - name: Secrets
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          STREAK_API_KEY: ${{ secrets.STREAK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAPPERS_API_KEY: ${{ secrets.PAPPERS_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          python3 - <<'EOF' > secrets.json
          import json, os
          keys = ["LINKEDIN_CLIENT_ID","LINKEDIN_CLIENT_SECRET","STREAK_API_KEY","RESEND_API_KEY",
                  "PAPPERS_API_KEY","COMPANIES_HOUSE_API_KEY","SESSION_SECRET","WEBHOOK_TOKEN","INGEST_TOKEN"]
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))
          EOF
          wrangler pages secret bulk secrets.json --project-name="$PROJECT"
          rm secrets.json

      - name: Deploy
        run: wrangler pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Custom domain (talkingpoints.gershon.ai)
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"$DOMAIN\"}" | python3 -c "import json,sys;r=json.load(sys.stdin);print('domain:', 'ok' if r.get('success') else r.get('errors'))"
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=gershon.ai" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys;r=json.load(sys.stdin)['result'];print(r[0]['id'] if r else '')")
          if [ -n "$ZONE" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"talkingpoints\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              | python3 -c "import json,sys;r=json.load(sys.stdin);print('dns:', 'ok' if r.get('success') else r.get('errors'))"
          else
            echo "dns: token cannot see the gershon.ai zone. Charles adds CNAME talkingpoints -> $PROJECT.pages.dev"
          fi

      - name: Register Streak webhooks
        run: |
          sleep 20
          for host in "https://$DOMAIN" "https://$PROJECT.pages.dev"; do
            out=$(curl -s -X POST "$host/api/admin/webhooks" -H "Authorization: Bearer $INGEST_TOKEN") && echo "$host → $out" && break
          done
