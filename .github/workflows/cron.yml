name: Hourly — new leads and meeting talking points
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run /api/cron/run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Secrets not set yet — skipping."; exit 0; fi
          TOKEN=$(printf '%s' tp-ingest | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" | awk '{print $2}')
          echo "::add-mask::$TOKEN"
          # Only our own domain: talkingpoints.pages.dev belongs to someone else.
          out=$(curl -sf -X POST "https://talkingpoints.gershon.ai/api/cron/run" -H "Authorization: Bearer $TOKEN") && { echo "$out"; exit 0; }
          echo "App not reachable"; exit 1
