name: Hourly — new leads and meeting talking points
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

# No stored secret: the job proves who it is with a GitHub OIDC token (audience
# talkingpoints.gershon.ai, repository gershonconsulting/talkingpoints), checked by the app.
permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run /api/cron/run and keep Streak webhooks registered
        run: |
          TOKEN=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=talkingpoints.gershon.ai" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          # Only our own domain: talkingpoints.pages.dev belongs to someone else.
          APP=https://talkingpoints.gershon.ai
          out=$(curl -sf -X POST "$APP/api/cron/run" -H "Authorization: Bearer $TOKEN") || { echo "App not reachable"; exit 1; }
          echo "$out"
          curl -s -X POST "$APP/api/admin/webhooks" -H "Authorization: Bearer $TOKEN"; echo
